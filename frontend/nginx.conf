server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxying (plan §A.11) — the browser never needs
    # VITE_BACKEND_URL baked in; everything is same-origin here exactly like
    # vite.config.ts's dev-server proxy, so the same built image works
    # unmodified in dev, staging and prod.

    # CopilotKit v2 runtime (runtime/) — SSE, so buffering MUST be off or
    # events arrive in bursts and the streaming UI stutters. The Python
    # agent can think for minutes, so the read timeout is generous.
    location /api/copilotkit/ {
        proxy_pass http://copilot-runtime:3001/api/copilotkit/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Role $http_x_auth_request_role;
    }

    # Offloaded artifacts (plan §A.6/Stage 6) — served by the SAME runtime
    # process as /api/copilotkit/ but outside that path prefix, so it needs
    # its own block. Binary, not SSE: buffering stays on (the default).
    location /api/artifacts/ {
        proxy_pass http://copilot-runtime:3001/api/artifacts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Direct REST/SSE to the Python backend: /upload (25MB multipart),
    # /conversations, /comments. (/agui itself is no longer called directly
    # from the browser — the runtime's DiagramHttpAgent is the only caller —
    # but this block stays for the other endpoints below it.)
    location /api/backend/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Role $http_x_auth_request_role;
    }

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
